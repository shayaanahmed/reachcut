name: reachcut-testing

# Independent images, ports, network and volumes. Never mounts production data
# or loads .env credentials. Start with --env-file /dev/null.
services:
  api:
    image: reachcut-testing-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      CLIPPER_DATA_DIR: /data
      CLIPPER_DATABASE_URL: sqlite:////data/clipper.db
      CLIPPER_WEB_PORT: "3300"
      CLIPPER_WEB_BASE_URL: http://127.0.0.1:3300
      CLIPPER_EDITORIAL_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /models/huggingface
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8300:8000"
    volumes:
      - test-data:/data
      - test-models:/models/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
  web:
    image: reachcut-testing-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_UPLOAD_API_URL: http://127.0.0.1:8300/api
    init: true
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3300:3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  test-data:
  test-models:
