services:
  api:
    environment:
      CLIPPER_EDITORIAL_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
        restart: true

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    init: true
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  model-init:
    image: ollama/ollama:0.32.5
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${CLIPPER_EDITORIAL_MODEL:-qwen3:8b-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-models:
