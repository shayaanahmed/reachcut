name: clipper

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLIPPER_DATA_DIR: /data
      CLIPPER_DATABASE_URL: sqlite:////data/clipper.db
      CLIPPER_TRANSCRIPTION_PROVIDER: ${CLIPPER_TRANSCRIPTION_PROVIDER:-faster-whisper}
      CLIPPER_WHISPER_MODEL: ${CLIPPER_WHISPER_MODEL:-small}
      CLIPPER_WHISPER_DEVICE: ${CLIPPER_WHISPER_DEVICE:-cpu}
      CLIPPER_WHISPER_COMPUTE_TYPE: ${CLIPPER_WHISPER_COMPUTE_TYPE:-int8}
      CLIPPER_EDITORIAL_PROVIDER: ${CLIPPER_EDITORIAL_PROVIDER:-ollama}
      CLIPPER_EDITORIAL_BASE_URL: ${CLIPPER_DOCKER_EDITORIAL_BASE_URL:-http://host.docker.internal:11434}
      CLIPPER_EDITORIAL_MODEL: ${CLIPPER_EDITORIAL_MODEL:-qwen3:8b-q4_K_M}
      CLIPPER_EDITORIAL_TIMEOUT_SECONDS: ${CLIPPER_EDITORIAL_TIMEOUT_SECONDS:-600}
      CLIPPER_EDITORIAL_NUM_CTX: ${CLIPPER_EDITORIAL_NUM_CTX:-8192}
      CLIPPER_EDITORIAL_NUM_PREDICT: ${CLIPPER_EDITORIAL_NUM_PREDICT:-2048}
      CLIPPER_EDITORIAL_RETRY_NUM_CTX: ${CLIPPER_EDITORIAL_RETRY_NUM_CTX:-16384}
      CLIPPER_EDITORIAL_RETRY_NUM_PREDICT: ${CLIPPER_EDITORIAL_RETRY_NUM_PREDICT:-4096}
      CLIPPER_MAX_UPLOAD_BYTES: ${CLIPPER_MAX_UPLOAD_BYTES:-8589934592}
      CLIPPER_MAX_DURATION_SECONDS: ${CLIPPER_MAX_DURATION_SECONDS:-21600}
      CLIPPER_YT_DLP_TIMEOUT_SECONDS: ${CLIPPER_YT_DLP_TIMEOUT_SECONDS:-3600}
      CLIPPER_YT_DLP_ALLOWED_HOSTS: ${CLIPPER_YT_DLP_ALLOWED_HOSTS:-youtube.com,youtu.be,vimeo.com,tiktok.com,twitch.tv,instagram.com,facebook.com,x.com,twitter.com}
      CLIPPER_WEB_PORT: ${CLIPPER_WEB_PORT:-3000}
      CLIPPER_WEB_BASE_URL: ${CLIPPER_WEB_BASE_URL:-http://127.0.0.1:3000}
      CLIPPER_YOUTUBE_CLIENT_ID: ${CLIPPER_YOUTUBE_CLIENT_ID:-}
      CLIPPER_YOUTUBE_CLIENT_SECRET: ${CLIPPER_YOUTUBE_CLIENT_SECRET:-}
      CLIPPER_YOUTUBE_REDIRECT_URI: ${CLIPPER_YOUTUBE_REDIRECT_URI:-http://127.0.0.1:8000/api/oauth/youtube/callback}
      CLIPPER_TIKTOK_CLIENT_KEY: ${CLIPPER_TIKTOK_CLIENT_KEY:-}
      CLIPPER_TIKTOK_CLIENT_SECRET: ${CLIPPER_TIKTOK_CLIENT_SECRET:-}
      CLIPPER_TIKTOK_REDIRECT_URI: ${CLIPPER_TIKTOK_REDIRECT_URI:-}
      CLIPPER_META_APP_ID: ${CLIPPER_META_APP_ID:-}
      CLIPPER_META_APP_SECRET: ${CLIPPER_META_APP_SECRET:-}
      CLIPPER_META_REDIRECT_URI: ${CLIPPER_META_REDIRECT_URI:-http://127.0.0.1:8000/api/oauth/meta/callback}
      CLIPPER_X_CLIENT_ID: ${CLIPPER_X_CLIENT_ID:-}
      CLIPPER_X_CLIENT_SECRET: ${CLIPPER_X_CLIENT_SECRET:-}
      CLIPPER_X_REDIRECT_URI: ${CLIPPER_X_REDIRECT_URI:-http://127.0.0.1:8000/api/oauth/x/callback}
      CLIPPER_META_GRAPH_VERSION: ${CLIPPER_META_GRAPH_VERSION:-v24.0}
      HF_HOME: /models/huggingface
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${CLIPPER_API_PORT:-8000}:8000"
    volumes:
      - clipper-data:/data
      - whisper-models:/models/huggingface
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    read_only: true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_UPLOAD_API_URL: ${CLIPPER_BROWSER_API_URL:-http://127.0.0.1:8000/api}
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${CLIPPER_WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  whisper-model-init:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CLIPPER_WHISPER_MODEL: ${CLIPPER_WHISPER_MODEL:-large-v3-turbo}
      HF_HOME: /models/huggingface
    command:
      - python
      - -c
      - >-
        import os;
        from faster_whisper.utils import download_model;
        model = os.environ["CLIPPER_WHISPER_MODEL"];
        print(download_model(model, cache_dir="/models/huggingface/hub"))
    volumes:
      - whisper-models:/models/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  clipper-data:
  whisper-models:
