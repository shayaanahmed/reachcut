name: Release installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package
        required: true
        default: 0.1.0
      channel:
        description: Isolated application channel
        required: true
        default: personal
        type: choice
        options:
          - personal
          - stable
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24.11.1"
          cache: pnpm

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and tests
        run: |
          pnpm check
          pnpm test

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
          else
            channel="stable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Build native installer
        run: pnpm build:installer -- --version "${{ steps.version.outputs.version }}" --channel "${{ steps.channel.outputs.channel }}"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v5
        with:
          name: reachcut-${{ steps.channel.outputs.channel }}-${{ runner.os }}-${{ runner.arch }}
          path: build/installers/*
          if-no-files-found: error
          retention-days: 14
