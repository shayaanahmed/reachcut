[project]
name = "clipper-api"
version = "0.1.0"
description = "Local-first AI video clipping control plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "fastapi>=0.138,<0.139",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0.43,<2.1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<0.36",
  "yt-dlp>=2026.8.19,<2027",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101", "S603", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
